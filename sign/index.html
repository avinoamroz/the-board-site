<style>
header{background:radial-gradient(circle at 12% 160%,#4A3FB8 0%,#1A1C2C 60%);border-bottom:4px solid var(--lime)}
.bar .lg{height:26px;width:auto;display:block}
.doc{max-height:none;overflow:visible}
.doc p{white-space:pre-line;line-height:1.75}
.doc .doc-title{font-size:1.45rem;margin:0}
.doc h3{border-right:4px solid var(--lime);padding-right:9px;margin-top:22px}
.lead{color:var(--muted);margin:0}
.signed-block{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.signed-block div{font-size:.95rem}.signed-block b{display:block;color:var(--muted);font-weight:500;font-size:.82rem}
.signed-block img{max-width:260px;width:100%;height:auto;border-bottom:1px solid var(--ink);display:block;margin-top:4px}
.ok-badge{display:inline-block;background:#E7F6D5;color:#2E5E0C;border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem}
.btn.ghost{background:#fff;border:1px solid var(--line)}
@media print{
  header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  body{background:#fff}
  main{padding-top:10px}
  .card{border:0;padding:0}

5 -661.62109375 7363.876953125 -613.76953125Q7396.34765625 -565.91796875 7396.34765625 -495.60546875Q7396.34765625 -435.05859375 7377.3046875 -394.04296875Q7358.26171875 -353.02734375 7324.08203125 -326.66015625Q7301.1328125 -308.59375 7272.32421875 -294.43359375L7421.25 -7.32421875V0.0H7244.00390625L7118.515625 -250.9765625H7019.8828125V0.0H6854.35546875V-710.9375ZM7019.8828125 -384.765625H7127.79296875Q7161.97265625 -384.765625 7184.921875 -395.99609375Q7207.87109375 -407.2265625 7219.345703125 -428.7109375Q7230.8203125 -450.1953125 7230.8203125 -480.46875Q7230.8203125 -525.390625 7205.4296875 -551.26953125Q7180.0390625 -577.1484375 7128.76953125 -577.1484375H7019.8828125Z M7690.17578125 0.0H7619.375V-710.9375H7844.9609375Q7941.640625 -710.9375 8015.615234375 -667.724609375Q8089.58984375 -624.51171875 8131.58203125 -547.607421875Q8173.57421875 -470.703125 8173.57421875 -369.140625V-341.30859375Q8173.57421875 -240.234375 8131.58203125 -163.330078125Q8089.58984375 -86.42578125 8015.859375 -43.212890625Q7942.12890625 0.0 7845.44921875 0.0ZM7785.390625 -133.30078125H7845.44921875Q7897.6953125 -133.30078125 7933.33984375 -156.73828125Q7968.984375 -180.17578125 7987.294921875 -226.5625Q8005.60546875 -272.94921875 8005.60546875 -341.30859375V-370.1171875Q8005.60546875 -438.96484375 7987.294921875 -484.86328125Q7968.984375 -530.76171875 7933.33984375 -553.955078125Q7897.6953125 -577.1484375 7844.9609375 -577.1484375H7785.390625Z"/></svg></div></header>
<main>
  <p id="loading" class="muted center">טוען את ההסכם...</p>
  <section id="err" class="card center" hidden><h1>הקישור לא תקין</h1><p class="muted">ייתכן שהקישור הועתק חלקית. כתבו לנו ל-<a href="mailto:info@the-board.co.il">info@the-board.co.il</a> ונשלח קישור חדש.</p></section>

  <section id="view" hidden>
    <div class="no-print" id="intro"><h1 id="hello">ההסכם שלך עם The Board</h1><p class="lead">קוראים את ההסכם עד הסוף, ממלאים פרטים וחותמים על המסך, עם העכבר, עם האצבע או בהקלדת השם. החתימה נשמרת יחד עם התאריך והשעה.</p></div>
    <div class="no-print" id="done" hidden><span class="ok-badge">ההסכם נחתם ✓</span><p class="lead" id="done-text" style="margin-top:8px"></p><div class="actions"><button class="btn" type="button" id="print">שמירה כ-PDF / הדפסה</button></div></div>
    <article class="card doc" id="doc"></article>
    <form class="card no-print" id="form" novalidate onsubmit="return false">
      <h2>פרטי החותם</h2>
      <div class="grid">
        <label><span>שם מלא</span><input name="name" required autocomplete="name"></label>
        <label><span>מספר ת״ז</span><input name="id_number" inputmode="numeric" dir="ltr"></label>
        <label><span>תפקיד</span><input name="role" autocomplete="organization-title"></label>
        <label><span>שם הארגון / החברה</span><input name="company" autocomplete="organization"></label>
      </div>
      <div class="sigwrap"><span>חתימה</span><div id="sig"></div></div>
      <label class="check"><input type="checkbox" name="agree"> קראתי את ההסכם, אני מוסמך/ת לחתום עליו בשם הארגון, ואני מסכים/ה לכל תנאיו</label>
      <div class="actions"><button class="btn" id="submit" type="submit">חתימה על ההסכם</button><span class="msg" id="msg" role="status"></span></div>
    </form>
  </section>
</main>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var $ = function(id){ return document.getElementById(id); }, esc = TBSign.esc;
  var q = new URLSearchParams(location.search), s = q.get("s") || "", t = q.get("t") || "", pad;
  function load(){
    return fetch("/api/contract?s=" + encodeURIComponent(s) + "&t=" + encodeURIComponent(t), { cache: "no-store" }).then(function(r){ return r.json(); });
  }
  function boardBlock(res){
    var b = res.board;
    if (!b) return '<div><b>בשם The Board</b>אבינועם רז, איתן ווליבוביץ, עדי חסדאי<br>ההסכם נשלח לחתימה על ידי The Board</div>';
    return '<div><b>בשם The Board</b>' + esc(b.name) + (b.role ? ', <span dir="ltr">' + esc(b.role) + '</span>' : '') + '<br>' + esc(b.date) + (b.signature ? '<img src="' + esc(b.signature) + '" alt="חתימה">' : '') + '</div>';
  }
  function showSigned(res){
    var g = res.signed;
    $("intro").hidden = true; $("form").hidden = true; $("done").hidden = false;
    $("done-text").textContent = "נחתם ב-" + g.at + ". אפשר לשמור עותק כ-PDF דרך הכפתור.";
    $("doc").innerHTML = TBSign.docHtml(res.doc) + '<div class="signed-block"><div><b>בשם ' + esc(res.partner) + '</b>' + esc(g.name) + (g.role ? ", " + esc(g.role) : "") + (g.idNumber ? '<br>ת״ז ' + esc(g.idNumber) : "") + '<br>' + esc(g.at) + '<img src="' + esc(g.signature) + '" alt="חתימה"></div>' + boardBlock(res) + '</div>';
  }
  load().then(function(res){
    $("loading").hidden = true;
    if (!res.ok) { $("err").hidden = false; return; }
    $("view").hidden = false;
    document.title = res.doc.title + " · The Board";
    if (res.signed) { showSigned(res); return; }
    var first = String(res.contact || "").split(" ")[0];
    $("hello").textContent = (first ? "היי " + first + ", " : "") + "ההסכם שלך עם The Board";
    $("doc").innerHTML = TBSign.docHtml(res.doc) + (res.board ? '<div class="signed-block">' + boardBlock(res) + '</div>' : "");
    var f = $("form");
    f.elements["name"].value = res.contact || ""; f.elements["company"].value = res.partner || "";
    pad = TBSign.mount($("sig"), { nameInput: f.elements["name"] });
    f.addEventListener("submit", function(ev){
      ev.preventDefault();
      var msg = $("msg"); msg.className = "msg err";
      if (f.elements["name"].value.trim().length < 2) { msg.textContent = "נא למלא שם מלא."; return; }
      if (pad.empty()) { msg.textContent = pad.mode() === "type" ? "נא להקליד את השם לחתימה." : "נא לחתום באזור החתימה."; return; }
      if (!f.elements["agree"].checked) { msg.textContent = "יש לאשר שקראת את ההסכם."; return; }
      $("submit").disabled = true; msg.className = "msg"; msg.textContent = "שומר את החתימה...";
      pad.data().then(function(sig){ return fetch("/api/contract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ s: s, t: t, name: f.elements["name"].value.trim(), id_number: f.elements["id_number"].value.trim(), role: f.elements["role"].value.trim(), company: f.elements["company"].value.trim(), agree: true, signature: sig, mode: pad.mode() }) }); })
        .then(function(r){ return r.json(); }).then(function(r){ if (!r.ok) throw new Error(r.error); return load(); })
        .then(function(res){ window.scrollTo(0, 0); showSigned(res); })
        .catch(function(){ $("submit").disabled = false; msg.className = "msg err"; msg.textContent = "החתימה לא נשמרה. נסו שוב."; });
    });
  }).catch(function(){ $("loading").hidden = true; $("err").hidden = false; });
  $("print").addEventListener("click", function(){ window.print(); });
});
</script>
</body>
